<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>STEAMLab · RA Merge experimental</title><link rel="stylesheet" href="style.css"><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><script src="./surface.js"></script></head><body style="margin:0;overflow:hidden"><div id="hud"><div class="panel"><b>STEAMLab · Merge Cube experimental</b><p>Apunta a una cara entrenada del cubo. La aplicación reconocerá esa imagen; si cambias de cara puede perderla momentáneamente.</p><label>x: <output id="xo">0.0</output> m<input id="x" type="range" min="-3" max="3" step="0.2" value="0"></label><label>y: <output id="yo">0.0</output> m<input id="y" type="range" min="-3" max="3" step="0.2" value="0"></label><p id="calc">T = 30.0 °C</p><a href="index.html">Inicio</a></div></div><a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.1" embedded color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: false; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-assets></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="targets"></a-entity></a-scene><div id="estado">Iniciando cámara. Asegúrate de haber subido targets.mind al repositorio.</div><script>
const targetHost=document.getElementById('targets');for(let i=0;i<6;i++){const anchor=document.createElement('a-entity');anchor.setAttribute('mindar-image-target',`targetIndex: ${i}`);const content=document.createElement('a-entity');content.setAttribute('thermal-surface','');anchor.appendChild(content);anchor.addEventListener('targetFound',()=>document.getElementById('estado').textContent=`Cara ${i+1} reconocida. Rota despacio y examina la superficie.`);anchor.addEventListener('targetLost',()=>document.getElementById('estado').textContent=`Seguimiento perdido: apunta de frente a una cara registrada.`);targetHost.appendChild(anchor)}
function update(){let x=+document.getElementById('x').value,y=+document.getElementById('y').value;const T=30+6*Math.sin(x/1.4)*Math.cos(y/1.3)+.6*x+.4*y;const gx=6/1.4*Math.cos(x/1.4)*Math.cos(y/1.3)+.6;const gy=-6/1.3*Math.sin(x/1.4)*Math.sin(y/1.3)+.4;document.getElementById('xo').textContent=x.toFixed(1);document.getElementById('yo').textContent=y.toFixed(1);document.getElementById('calc').textContent=`T: ${T.toFixed(1)} °C · ∇T: (${gx.toFixed(2)}, ${gy.toFixed(2)}) °C/m`;targetHost.querySelectorAll('[thermal-surface]').forEach(el=>el.setAttribute('thermal-surface',`x:${x};y:${y}`));}['x','y'].forEach(id=>document.getElementById(id).addEventListener('input',update));update();
</script></body></html>
